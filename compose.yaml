name: heyday

x-billing-environment: &billing-environment
  STRIPE_BILLING_ENABLED: ${STRIPE_BILLING_ENABLED:-false}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY:-}
  STRIPE_PRICE_YEARLY: ${STRIPE_PRICE_YEARLY:-}
  STRIPE_LEGACY_PRICE_IDS: ${STRIPE_LEGACY_PRICE_IDS:-}
  STRIPE_TRIAL_DAYS: ${STRIPE_TRIAL_DAYS:-0}
  STRIPE_PORTAL_CONFIGURATION_ID: ${STRIPE_PORTAL_CONFIGURATION_ID:-}

x-auth-environment: &auth-environment
  NODE_ENV: production
  # Generate POSTGRES_PASSWORD as hex (see .env.compose.example) to keep this URI valid.
  DATABASE_URL: postgresql://heyday:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.compose}@db:5432/heyday
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
  # Restricted to loopback origins by config.ts; never permits a public HTTP origin.
  AUTH_ALLOW_INSECURE_LOCALHOST: "true"
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env.compose}
  RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in .env.compose}
  AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:?Set AUTH_EMAIL_FROM in .env.compose}

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: heyday
      POSTGRES_DB: heyday
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.compose}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heyday -d heyday"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    environment: *auth-environment
    depends_on:
      db:
        condition: service_healthy

  service:
    build:
      context: .
      target: service
    restart: unless-stopped
    init: true
    environment:
      <<: [*auth-environment, *billing-environment]
      HOST: 0.0.0.0
      PORT: "3000"
      CLOUD_SYNC_ENABLED: ${CLOUD_SYNC_ENABLED:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  billing-reconcile:
    profiles: [billing]
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      <<: [*auth-environment, *billing-environment]
    command: ["bun", "scripts/billing-reconcile.ts"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
